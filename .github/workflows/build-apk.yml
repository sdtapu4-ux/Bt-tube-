name: Build BT Tube APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses and install Android 36 SDK
        shell: bash
        run: |
          set +o pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
            "$SDK_ROOT/tools/bin/sdkmanager" \
            "$(command -v sdkmanager || true)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          mkdir -p "$SDK_ROOT/licenses"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "build-tools;36.0.0" "platforms;android-36"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36.1" || true

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Ensure gradlew is executable
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Restore debug keystore matching Firebase SHA-1
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build BT Tube Debug APK
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/BT-Tube.apk

      - name: Upload BT Tube APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BT-Tube-APK
          path: |
            app/build/outputs/apk/debug/BT-Tube.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
