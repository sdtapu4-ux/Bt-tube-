name: Build BT Tube APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses and install Android 36 SDK
        shell: bash
        run: |
          set +o pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
            "$SDK_ROOT/tools/bin/sdkmanager" \
            "$(command -v sdkmanager || true)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          mkdir -p "$SDK_ROOT/licenses"
          touch "$SDK_ROOT/licenses/android-sdk-license" "$SDK_ROOT/licenses/android-sdk-preview-license"
          for hash in 24333f8a63b6825ea9c5514f83c2829b004d1fee 8933bad161af4178b1185d1a37fbf41ea5269c55 d56f5187479451eabf01fb78af6dfcb131a6481e; do
            grep -qxF "$hash" "$SDK_ROOT/licenses/android-sdk-license" || echo "$hash" >> "$SDK_ROOT/licenses/android-sdk-license"
          done
          grep -qxF "84831b9409646a918e30573bab4c9c91346d8abd" "$SDK_ROOT/licenses/android-sdk-preview-license" || \
            echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$SDK_ROOT/licenses/android-sdk-preview-license"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "build-tools;36.0.0" "platforms;android-36"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36.1" || \
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --channel=1 "platforms;android-36.1" || true

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Ensure gradlew is executable
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Restore debug keystore matching Firebase SHA-1
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restore optional google-services.json from GitHub Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      - name: Build BT Tube Debug APK
        run: |
          GRADLE_ARGS=(
            :app:assembleDebug
            --no-daemon
            --no-configuration-cache
            --console=plain
            "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"
            "-Dkotlin.compiler.execution.strategy=daemon"
          )
          if [ -x ./gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew "${GRADLE_ARGS[@]}"
          else
            gradle "${GRADLE_ARGS[@]}"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/BT-Tube.apk

      - name: Upload BT Tube APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BT-Tube-APK
          path: |
            app/build/outputs/apk/debug/BT-Tube.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
